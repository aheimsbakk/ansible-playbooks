---
- name: Configure k3s master
  hosts: k3s_cp
  become: true

  vars:
    deployment_path: /root/deployments

  tasks:

    - name: Compress base and deployment to local archive
      become: false
      ansible.builtin.command:
        cmd: tar -czf payload.tar.gz base deployment
        chdir: files/
      environment:
        COPYFILE_DISABLE: '1'
      delegate_to: localhost
      run_once: true

    - name: Create the deployment path
      ansible.builtin.file:
        path: "{{ deployment_path }}"
        mode: "0755"
        state: directory

    - name: Transfer and extract base and deployment
      ansible.builtin.unarchive:
        src: files/payload.tar.gz
        dest: "{{ deployment_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Clean up the local temporary archive
      become: false
      ansible.builtin.file:
        path: files/payload.tar.gz
        state: absent
      delegate_to: localhost
      run_once: true

    - name: Copy out environment
      ansible.builtin.copy:
        src: "{{ item }}/"
        dest: "{{ deployment_path }}/{{ item }}/"
        mode: "0600"
        directory_mode: "0700"
      loop:
        - "{{ env }}"

    - name: "Apply depolyments env '{{ env }}'"
      ansible.builtin.command: "kubectl apply -k {{ deployment_path }}/{{ env }}"
      changed_when: true

    - name: Remove deployment files
      ansible.builtin.file:
        path: "{{ deployment_path }}"
        state: absent
